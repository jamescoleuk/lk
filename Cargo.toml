[package]
authors = ["James Cole <jamescole.uk@gmail.com>"]
categories = ["command-line-interface", "command-line-utilities"]
description = "A command palette for your bash functions."
edition = "2024"
rust-version = "1.86"
keywords = ["bash", "cli"]
license = "MIT OR Apache-2.0"
name = "lk"
readme = "README.md"
repository = "https://github.com/jamescoleuk/lk"
version = "0.6.0"

[dependencies]
anyhow = "1.0" # Anyhow makes application error handling easier. If I was writing a library I'd use thiserror.
clap = { version = "4.6", features = ["derive"] } # To handle lk arguments.
config = { version = "0.15", default-features = false, features = ["toml"] } # Config-rs reads config from files or environment
content_inspector = "0.2" # To detect and ignore binary executables.
dirs = "6.0"
fuzzy-matcher = "0.3"
fuzzy_finder = "0.4"
glob = "0.3" # We want include and exclude to use proper pattern matching
log = "0.4"
pastel_colours = "0.2"
ratatui = "0.30"
regex = "1"
simplelog = "0.12" # File logging without log4rs's dependency tree
spinners = "4"
tempfile = "3" # Somewhere to store lk's temp file

[dev-dependencies]
tempfile = "3" # For an isolated config dir in the integration tests
